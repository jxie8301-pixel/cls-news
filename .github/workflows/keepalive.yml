name: 保活 commit（每月第一个周日）

# DISABLED 2026-09-22：已切流到 jxie8301-pixel/news-crawler。已去掉 schedule，job if:false。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 提交保活 commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(date '+%Y-%m-%d') [skip ci]"
          git push origin master
          echo "保活 commit 已提交：$(date '+%Y-%m-%d %H:%M %Z')"
