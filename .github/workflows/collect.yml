name: 抓取 + 企业微信推送 + 发布 Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 每 5 分钟触发一次（UTC），刻意避开整点最拥挤的槽位。
    # 每次触发只用 1 个请求查 VIP 列表（哨兵）：有新的带个股 VIP 新闻才全市场抓取+发布，
    # 否则本轮跳过不发布。GitHub schedule 不保证准时，繁忙时实际间隔可能更长。
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 门控（已停用时段判断）────────────────────────────────────
  # 原按交易时段决定是否抓取的逻辑已停用：现在每个触发都放行进入 build，
  # 真正「抓不抓」由 build 内的 VIP 哨兵决定（有新的带个股 VIP 新闻才全市场抓取，
  # 否则本轮跳过不发布）。GitHub Actions 每次换出口 IP，不存在 IP 被封问题。
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: 总是放行（交由 VIP 哨兵门控）
        id: decide
        run: echo "run=true" >> "$GITHUB_OUTPUT"

  # ── 抓取 + 推送 + 组装发布目录 ───────────────────────────────
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备配置与数据目录
        run: |
          cp config.example.json config.json
          mkdir -p data out
          # 继承上一次 Pages 发布的调研/技术面缓存，避免每轮全市场重新请求
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/research.json  -o data/research.json  || true
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/technical.json -o data/technical.json || true
          # 拉回上一轮发布的 status.json（VIP 哨兵据此读 lastVipCtime 判断有无新 VIP 新闻）
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/status.json    -o out/status.json     || true

      # 从 data 分支取回上一轮的「已推送记录」，实现跨轮去重（B1）
      - name: 取回已推送记录 (data 分支)
        run: |
          git fetch origin data --depth 1 || true
          if git cat-file -e origin/data:pushed.json 2>/dev/null; then
            git show origin/data:pushed.json > data/pushed.json
            echo "已取回 pushed.json"
          else
            echo "data 分支暂无 pushed.json，首次运行。"
          fi

      - name: 抓取沪深A股目标栏目新闻 + 企业微信推送（只跑 all-a 池）
        id: collect
        env:
          TZ: Asia/Shanghai
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          set +e
          node src/cli.js --pool all-a --site-links
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "VIP 哨兵：无新的带个股 VIP 新闻，本轮跳过发布。"
            exit 0
          elif [ "$code" != "0" ]; then
            echo "抓取失败，退出码 $code"
            exit $code
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      # 把更新后的 pushed.json 提交回 data 分支（孤立分支，只存这一个文件）
      - name: 保存已推送记录 (data 分支)
        if: steps.collect.outputs.skipped != 'true'
        run: |
          if [ ! -f data/pushed.json ]; then echo "无 pushed.json，跳过"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp data/pushed.json "$tmp/pushed.json"
          git fetch origin data --depth 1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$tmp/pushed.json" pushed.json
          git add pushed.json
          git commit -m "update pushed.json [skip ci]" || echo "无变化，跳过提交"
          git push origin data
          git checkout -

      - name: 组装发布目录
        if: steps.collect.outputs.skipped != 'true'
        run: |
          mkdir -p _site/cards
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json  _site/research.json  || true
          cp data/technical.json _site/technical.json || true
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt

      - uses: actions/configure-pages@v5
        if: steps.collect.outputs.skipped != 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.skipped != 'true'
        with:
          path: _site

    outputs:
      skipped: ${{ steps.collect.outputs.skipped }}

  # ── 部署到 GitHub Pages ─────────────────────────────────────
  deploy:
    needs: build
    # 哨兵跳过本轮时不部署（沿用上一版 Pages）
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
