name: 抓取 + 企业微信推送 + 发布 Pages

# 「要不要跑」由外部 cls-trigger（VIP 水位 + 有标的）决定后 workflow_dispatch。
# 本 workflow 不再定时轮询，也不再做 VIP 新增差集门控；被触发后直接全市场抓取并发布。
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备配置与数据目录
        run: |
          cp config.example.json config.json
          mkdir -p data out
          # 继承上一次 Pages 的调研/技术面缓存，避免每轮全市场重新请求
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/research.json  -o data/research.json  || true
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/technical.json -o data/technical.json || true
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/status.json    -o out/status.json     || true

      - name: 取回已推送记录 (data 分支)
        run: |
          git fetch origin data --depth 1 || true
          if git cat-file -e origin/data:pushed.json 2>/dev/null; then
            git show origin/data:pushed.json > data/pushed.json
            echo "已取回 pushed.json"
          else
            echo "data 分支暂无 pushed.json，首次运行。"
          fi

      - name: 抓取沪深A股目标栏目新闻 + 企业微信推送（只跑 all-a 池）
        id: collect
        env:
          TZ: Asia/Shanghai
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          # 外部已判定需抓取；默认不做 VIP 差集门控（cli 仅在显式 --gate 时才可能 exit 3）
          node src/cli.js --pool all-a --site-links

      - name: 保存已推送记录 (data 分支)
        run: |
          if [ ! -f data/pushed.json ]; then echo "无 pushed.json，跳过"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          cp data/pushed.json "$tmp/pushed.json"
          git fetch origin data --depth 1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp "$tmp/pushed.json" pushed.json
          git add pushed.json
          git commit -m "update pushed.json [skip ci]" || echo "无变化，跳过提交"
          git push origin data
          git checkout -

      - name: 组装发布目录
        run: |
          mkdir -p _site/cards
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json  _site/research.json  || true
          cp data/technical.json _site/technical.json || true
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
