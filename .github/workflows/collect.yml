name: 抓取并发布到 Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 每 10 分钟一次（UTC）。GitHub 定时任务最小粒度是 5 分钟；
    # 每 30 分钟一次（UTC）。刻意避开整点（:00）这个最拥挤的槽位。
    # 注意：schedule 在平台繁忙时会被延后，实际间隔常见 30~60 分钟。
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备配置
        run: |
          cp config.example.json config.json
          mkdir -p data
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/research.json -o data/research.json || true

      - name: 抓取（只跑沪深A股池，避免把个人自选股带进公开页面）
        env:
          TZ: Asia/Shanghai
        run: node src/cli.js --pool all-a --days 7 --site-links

      - name: 组装发布目录
        run: |
          mkdir -p _site/cards
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp data/research.json _site/research.json
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt
          echo '--- 明细 ---'
          wc -c _site/index.html _site/cards/index.html _site/news.csv

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
