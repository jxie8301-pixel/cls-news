name: 抓取 + 企业微信推送 + 发布 Pages

# 「要不要跑」主要由外部 cls-trigger（VIP 水位 + 有标的）workflow_dispatch。
# 本 workflow 再做 VIP 差集门控：相对上轮新增 0 条则跳过抓取/推送/Pages（exit 3 → soft skip）。
# 不在 push 时触发，避免改代码就全量跑；需要强制全量可手动 dispatch 并加输入，或本地 --no-gate。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.collect.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 准备配置与数据目录
        run: |
          cp config.example.json config.json
          mkdir -p data out
          # 继承上一次 Pages 的调研缓存 / VIP 水位，避免每轮全市场重跑、门控失效
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/research.json  -o data/research.json  || true
          curl -fsSL --retry 2 https://jxie8301-pixel.github.io/cls-news/status.json    -o out/status.json     || true

      - name: 取回已推送记录与股票池缓存 (data 分支)
        run: |
          git fetch origin data --depth 1 || true
          if git cat-file -e origin/data:pushed.json 2>/dev/null; then
            git show origin/data:pushed.json > data/pushed.json
            echo "已取回 pushed.json"
          else
            echo "data 分支暂无 pushed.json，首次运行。"
          fi
          mkdir -p data/pools
          if git cat-file -e origin/data:pools/all-a.json 2>/dev/null; then
            git show origin/data:pools/all-a.json > data/pools/all-a.json
            echo "已取回 pools/all-a.json（股票池日缓存）"
          else
            echo "data 分支暂无 pools/all-a.json，本轮将尝试在线拉取。"
          fi

      - name: 检查 MiniMax 密钥是否注入（不打印密钥）
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          if [ -n "${MINIMAX_API_KEY}" ]; then
            echo "[minimax] secret_check: present=yes len=${#MINIMAX_API_KEY}"
            echo "[minimax] hint: build 只能读 Repository secrets，读不到 Environment(github-pages) secrets"
          else
            echo "[minimax] secret_check: present=no"
            echo "[minimax] hint: 请到 Settings → Secrets → Actions → Repository secrets 配置 MINIMAX_API_KEY"
            echo "[minimax] hint: 若只配在 Environment github-pages，本 build 步骤读不到"
          fi

      - name: 抓取沪深A股(非ST)目标栏目新闻 + 企业微信推送（只跑 all-a 池）
        id: collect
        env:
          TZ: Asia/Shanghai
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
        run: |
          set +e
          node src/cli.js --pool all-a --site-links
          code=$?
          if [ "$code" -eq 3 ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "无新增 VIP，跳过后续推送与 Pages 发布"
            exit 0
          fi
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          exit $code

      - name: 保存已推送记录与股票池缓存 (data 分支)
        if: steps.collect.outputs.skipped != 'true'
        run: |
          if [ ! -f data/pushed.json ] && [ ! -f data/pools/all-a.json ]; then
            echo "无 pushed.json / pools 缓存，跳过"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp=$(mktemp -d)
          [ -f data/pushed.json ] && cp data/pushed.json "$tmp/pushed.json"
          [ -f data/pools/all-a.json ] && mkdir -p "$tmp/pools" && cp data/pools/all-a.json "$tmp/pools/all-a.json"
          git fetch origin data --depth 1 || true
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git checkout -B data origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          [ -f "$tmp/pushed.json" ] && cp "$tmp/pushed.json" pushed.json && git add pushed.json
          if [ -f "$tmp/pools/all-a.json" ]; then
            mkdir -p pools
            cp "$tmp/pools/all-a.json" pools/all-a.json
            git add pools/all-a.json
          fi
          git commit -m "update pushed.json + pool cache [skip ci]" || echo "无变化，跳过提交"
          git push origin data
          git checkout -

      - name: 组装发布目录
        if: steps.collect.outputs.skipped != 'true'
        run: |
          mkdir -p _site/cards
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json  _site/research.json  || true
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt

      - uses: actions/configure-pages@v5
        if: steps.collect.outputs.skipped != 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.skipped != 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
