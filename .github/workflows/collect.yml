name: 抓取并发布到 Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # 每 30 分钟触发一次（UTC），刻意避开整点这个最拥挤的槽位。
    # 是否真的抓取由 src/schedule.js 按刷新节奏判断：
    #   交易日 07:00-16:00 -> 每 30 分钟
    #   交易日 其他时段     -> 每 2 小时
    #   非交易日            -> 每 6 小时
    # 交易日用上证指数当日日K核对，A 股节假日自动按非交易日处理。
    # 注意：schedule 在平台繁忙时会被延后，实际触发常见 30~60 分钟。
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 判断本轮是否需要刷新
        id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "非定时触发（${{ github.event_name }}），直接执行。"
            exit 0
          fi
          set +e
          node src/schedule.js --check
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备配置
        run: |
          cp config.example.json config.json
          mkdir -p data
          curl -fsSL --retry 2 https://yunqingzou-bit.github.io/cls-news-dashboard/research.json -o data/research.json || true

      - name: 抓取（只跑沪深A股池，避免把个人自选股带进公开页面）
        env:
          TZ: Asia/Shanghai
        run: node src/cli.js --pool all-a --days 7 --site-links

      - name: 组装发布目录
        run: |
          mkdir -p _site/cards
          cp out/cls-news-latest.html _site/index.html
          cp out/cls-news-cards.html  _site/cards/index.html
          cp out/cls-news-latest.csv  _site/news.csv
          cp out/cls-news-latest.json _site/news.json
          cp out/status.json          _site/status.json
          cp data/research.json _site/research.json
          TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z' > _site/updated.txt
          echo '--- 明细 ---'
          wc -c _site/index.html _site/cards/index.html _site/news.csv

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
